[build]
  base    = "apps/site"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS at /admin/ — Netlify Identity handles login, git-gateway
# proxies commits to GitHub. Enable both in the Netlify dashboard:
# Site settings → Identity → Enable Identity; Identity → Services →
# Git Gateway → Enable.
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# Pretty 404 — Astro emits 404.html in the dist root.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Basic hardening (no CSP: the admin + AI cut-out load scripts from CDNs).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"

# Astro fingerprints these files, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
