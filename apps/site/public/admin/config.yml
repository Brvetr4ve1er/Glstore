# SHINOBI — Decap CMS configuration.
#
# When the site is deployed to Netlify, this file lets the owner edit
# content through a friendly UI at /admin/ — no code, no git.
# Edits are committed back to GitHub by Netlify.

backend:
  name: git-gateway
  # MUST be the branch Netlify deploys to production. The site currently
  # lives on this branch of the Glstore repo. When apps/site/ moves to
  # its own repo, change this to `main` AND drop the `apps/site/`
  # prefix from every path below (see docs BRANCH-CONTEXT.md §4).
  branch: claude/shinobi-shop-rebuild

# Owners log in with email through Netlify Identity (free tier).
# No editorial workflow: "Publier" goes live directly (~1 min rebuild).
# Schemas are validated at build time, so a bad edit can't break the site.
locale: fr
logo_url: /assets/mascot.svg
media_folder: "apps/site/public/images/designs"
public_folder: "/images/designs"

collections:
  # ── 1. Bases (T-shirt, sweat, …) ─────────────────────────────
  - name: bases
    label: "Bases (prix par produit)"
    label_singular: "Base"
    folder: "apps/site/src/content/bases"
    create: true
    format: json
    extension: json
    identifier_field: id
    summary: "{{name}} — {{price}} DA"
    fields:
      - { name: id, label: "Identifiant (sans espace)", widget: string, hint: "ex: tshirt, sweat, mug" }
      - { name: name, label: "Nom affiché", widget: string }
      - { name: price, label: "Prix (DA)", widget: number, value_type: int, min: 0 }
      - { name: doubleSideAllowed, label: "Recto + verso autorisé ?", widget: boolean, default: true }
      - { name: extraDoubleSide, label: "Supplément recto+verso (DA)", widget: number, value_type: int, min: 0, default: 500 }
      - { name: icon, label: "Emoji (preview)", widget: string, default: "👕" }
      - { name: order, label: "Ordre (1 = en premier)", widget: number, value_type: int, default: 1 }

  # ── 2. Designs (anime artworks) ──────────────────────────────
  - name: designs
    label: "Designs (catalogue anime)"
    label_singular: "Design"
    folder: "apps/site/src/content/designs"
    create: true
    format: json
    extension: json
    identifier_field: id
    summary: "{{name}} — {{anime}}"
    fields:
      - { name: id, label: "Identifiant", widget: string, pattern: ['^[a-z0-9-]+$', 'Minuscules, chiffres et tirets uniquement (ex: gojo-satoru)'], hint: "Utilisé dans le lien du design. ex: gojo, sukuna-2" }
      - { name: name, label: "Nom du design", widget: string }
      - { name: anime, label: "Anime / franchise", widget: string }
      - {
          name: image,
          label: "Image du design",
          widget: image,
          required: false,
          choose_url: false,
          hint: "PNG à fond transparent, idéalement 1500 px ou plus. C'est cette image qui sera imprimée."
        }
      - {
          name: emoji,
          label: "…ou un emoji en attendant l'image",
          widget: string,
          required: false,
          hint: "Utilisé seulement s'il n'y a pas d'image. ex: 🥷"
        }
      - {
          name: tagColor,
          label: "Couleur du tag",
          widget: select,
          options: [naruto, jjk, onepiece, dbz, bleach, aot, deathnote, bluelock, original],
          default: original
        }
      - { name: featured, label: "Mettre en avant sur la page d'accueil ?", widget: boolean, default: false }
      - {
          name: rarity,
          label: "Rareté (invocation du Dojo)",
          widget: select,
          default: commun,
          options: [{ label: "Commun", value: commun }, { label: "Rare", value: rare }, { label: "Légendaire", value: legendaire }],
          hint: "Un design légendaire sort rarement à l'invocation quotidienne."
        }
      - {
          name: unlockRank,
          label: "Design secret ?",
          widget: select,
          default: "0",
          options: [{ label: "Non — visible par tous", value: "0" }, { label: "Genin 下忍 (50 chakra)", value: "1" }, { label: "Chūnin 中忍 (150 chakra)", value: "2" }, { label: "Jōnin 上忍 (300 chakra)", value: "3" }, { label: "Shinobi 忍者 (500 chakra)", value: "4" }],
          hint: "Un design secret apparaît en silhouette 🔒 jusqu'à ce que le client atteigne ce rang au Dojo."
        }
      - { name: order, label: "Ordre", widget: number, value_type: int, default: 1 }

  # ── 3. Site settings (singleton) ────────────────────────────
  - name: site
    label: "Paramètres du site"
    files:
      - name: site
        label: "Réglages"
        file: "apps/site/src/content/site.json"
        format: json
        fields:
          - label: "Marque"
            name: brand
            widget: object
            fields:
              - { name: name, label: "Nom", widget: string }
              - { name: tagline, label: "Slogan", widget: string }
              - { name: kanji, label: "Kanji décoratif", widget: string, default: "忍者" }

          - label: "Hero (page d'accueil)"
            name: hero
            widget: object
            fields:
              - { name: eyebrow, label: "Sur-titre", widget: string }
              - { name: title, label: "Titre principal", widget: string }
              - { name: subtitle, label: "Sous-titre", widget: text }
              - { name: primaryCta, label: "Bouton principal — texte", widget: string }
              - { name: primaryCtaHref, label: "Bouton principal — lien", widget: string, default: "/custom" }
              - { name: secondaryCta, label: "Bouton secondaire — texte", widget: string }
              - { name: secondaryCtaHref, label: "Bouton secondaire — lien", widget: string, default: "/boutique" }

          - label: "Contact"
            name: contact
            widget: object
            fields:
              - {
                  name: whatsappNumber,
                  label: "WhatsApp (format international SANS le +)",
                  widget: string,
                  hint: "ex: 213555000000 pour +213 5 55 00 00 00",
                  pattern: ['^[0-9]{8,15}$', 'Chiffres uniquement']
                }
              - { name: instagram, label: "Pseudo Instagram (sans @)", widget: string }
              - { name: phone, label: "Téléphone affiché", widget: string }
              - { name: email, label: "Email", widget: string }

          - label: "Boutique physique"
            name: boutique
            widget: object
            fields:
              - { name: name, label: "Nom", widget: string }
              - { name: address, label: "Adresse", widget: string }
              - { name: mapUrl, label: "Lien Google Maps", widget: string }
              - name: hours
                label: "Horaires"
                widget: list
                fields:
                  - { name: day, label: "Jour(s)", widget: string }
                  - { name: open, label: "Plage horaire", widget: string }
              - { name: leadTimeDays, label: "Délai d'impression (jours)", widget: string, default: "3 à 4" }

          - label: "Politique de livraison"
            name: policies
            widget: object
            fields:
              - { name: delivery, label: "Phrase livraison", widget: text }
              - { name: deliveryPriceDZD, label: "Prix livraison (DA)", widget: number, value_type: int, min: 0 }
              - { name: pickupPriceDZD, label: "Prix retrait en boutique (DA)", widget: number, value_type: int, default: 0 }
              - { name: returnDays, label: "Délai de retour (jours)", widget: number, value_type: int, default: 14 }

          - label: "Le Dojo (programme de fidélité)"
            name: dojo
            widget: object
            fields:
              - { name: enabled, label: "Activer le Dojo", widget: boolean, default: true }
              - name: rewards
                label: "Cadeaux par rang"
                label_singular: "Cadeau"
                widget: list
                required: false
                summary: "Rang {{fields.rank}} — {{fields.text}}"
                hint: "Ajoutés au message de commande du client. C'est la boutique qui les confirme."
                fields:
                  - { name: rank, label: "Rang", widget: select, options: [{ label: "Genin 下忍 (50 chakra)", value: "1" }, { label: "Chūnin 中忍 (150 chakra)", value: "2" }, { label: "Jōnin 上忍 (300 chakra)", value: "3" }, { label: "Shinobi 忍者 (500 chakra)", value: "4" }] }
                  - { name: text, label: "Cadeau", widget: string }

          - label: "Prochain drop (compte à rebours sur l'accueil)"
            name: drop
            widget: object
            fields:
              - { name: title, label: "Nom du drop", widget: string, required: false, hint: "ex: Collection Hiver" }
              - { name: date, label: "Date et heure", widget: datetime, required: false, hint: "Laisse vide pour cacher le compte à rebours." }
              - { name: href, label: "Lien du bouton", widget: string, default: "/galerie/" }

          - label: "Questions fréquentes (page Infos)"
            name: faq
            widget: list
            required: false
            summary: "{{fields.q}}"
            fields:
              - { name: q, label: "Question", widget: string }
              - { name: a, label: "Réponse", widget: text }

# Set this to `true` when running Decap locally with `npx decap-server`.
# In production, leave it commented out.
# local_backend: true
