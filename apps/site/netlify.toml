# SHINOBI — Netlify deploy config.
# Drag-deploy from `apps/site/`, or connect the GitHub repo and set
# the base directory to `apps/site/` in the Netlify UI.

[build]
  base    = "apps/site"
  publish = "apps/site/dist"
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS at /admin/ — Netlify Identity handles login, git-gateway
# proxies commits to GitHub. Enable both in the Netlify dashboard:
# Site settings → Identity → Enable Identity; Identity → Services →
# Git Gateway → Enable.
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# Pretty 404 — Astro emits 404.html in the dist root.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
