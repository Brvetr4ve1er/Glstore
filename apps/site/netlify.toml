# SHINOBI — Netlify deploy config.
#
# When connecting the GitHub repo on Netlify, point at this branch
# (e.g. claude/shinobi-shop-rebuild or main after merge). Netlify
# reads this file from apps/site/netlify.toml and infers everything.

[build]
  # When base = "apps/site", every other path is RELATIVE to that.
  # So publish is "dist" (apps/site/dist on disk), not "apps/site/dist".
  base    = "apps/site"
  publish = "dist"
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS lives at /admin/ — Netlify Identity handles login,
# git-gateway proxies commits to GitHub. Enable both in the dashboard:
#   Site settings → Identity → Enable Identity
#   Identity → Registration preferences → Invite only
#   Identity → Services → Git Gateway → Enable
# Then invite the owner by email.

# /admin → /admin/index.html (so the editor URL is pretty)
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# Astro emits a top-level 404.html that Netlify serves automatically
# when no route matches — no catch-all redirect needed.
