# SHINOBI — Netlify deploy config (subdirectory version).
# Used when Netlify UI base directory is set to "apps/site", or for
# drag-and-drop deploys of the pre-built dist/ folder.
# For full-repo deploys, the root-level netlify.toml takes precedence.

[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS at /admin/
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# Pretty 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Basic hardening (no CSP: the admin + AI cut-out load scripts from CDNs).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), payment=()"

# Astro fingerprints these files, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
