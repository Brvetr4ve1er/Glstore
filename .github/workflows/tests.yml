name: tests

"on":
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the runtime the app actually ships on: docker/Dockerfile.api,
          # docker/Dockerfile.worker and docker/Dockerfile.scraper are all
          # "FROM python:3.12-slim" (DEPLOY.md's "Python 3.11+" is a floor for
          # the one-off local deploy scripts, not the pin used here).
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/

      # --- Loud-skip guard -------------------------------------------------
      # tests/test_store_context.py (40+ assertions guarding the multi-brand
      # isolation boundary) uses pytest.importorskip on sqlalchemy/pyjwt, so
      # if either is ever missing from requirements.txt - or this job's
      # "pip install" step above regresses - the file collects ZERO real
      # tests and the whole module collapses into a single "skipped" result
      # instead of failing. A bare "python -m pytest tests/" then reports a
      # comfortable green ("N passed, 1 skipped") while the tenancy guard
      # never actually ran.
      #
      # This step re-runs that file alone with --junitxml and inspects the
      # structured <testsuite> counts (tests/skipped/failures/errors)
      # instead of grepping pytest's human-readable text output. That text
      # is NOT a stable signal: this repo's pyproject.toml already adds -q
      # via addopts, so an extra -q on the command line here would silently
      # double up to -qq and suppress the "N passed" summary line entirely
      # - the JUnit XML counts are unaffected by verbosity flags or by
      # pytest's wording changing between versions.
      - name: Guard against tests/test_store_context.py silently skipping
        run: |
          python -m pytest tests/test_store_context.py --junitxml=store_context_junit.xml || true
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("store_context_junit.xml")
          root = tree.getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("::error::could not find a <testsuite> in store_context_junit.xml")
              sys.exit(1)

          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          passed = tests - skipped - failures - errors

          print(
              f"tests/test_store_context.py: tests={tests} passed={passed} "
              f"skipped={skipped} failures={failures} errors={errors}"
          )

          if skipped > 0:
              print(
                  f"::error::tests/test_store_context.py reported {skipped} "
                  f"skipped test(s). This file has no legitimate per-test "
                  f"skips (only a module-level pytest.importorskip on "
                  f"sqlalchemy/pyjwt), so any skip here means the multi-brand "
                  f"tenancy guard did not execute - most likely sqlalchemy "
                  f"and/or pyjwt are missing from this environment. "
                  f"Failing the build; do not let this go green."
              )
              sys.exit(1)
          if failures > 0 or errors > 0:
              print(
                  f"::error::tests/test_store_context.py had {failures} "
                  f"failure(s) and {errors} error(s)."
              )
              sys.exit(1)
          if passed <= 0:
              print("::error::tests/test_store_context.py reported zero passing tests.")
              sys.exit(1)

          print(f"Tenancy guard OK: {passed} test(s) passed, 0 skipped.")
          PY

  # --- Serverless bundle guard ---------------------------------------------
  # The `pytest` job above installs the ROOT requirements.txt, which is a
  # superset of api/requirements.txt. That makes it structurally blind to the
  # thing that actually breaks a Vercel deploy: a module the API imports whose
  # package is missing from the SLIM list. The symptom is never a failing
  # test - it is a 500 on every request at cold start, discovered only after
  # the deploy, with `ModuleNotFoundError` buried in the function logs.
  #
  # So this job reproduces Vercel's build inputs exactly and nothing else:
  # the Python from .python-version, ONLY api/requirements.txt, and then the
  # single import Vercel performs to serve the app. It is the cheapest
  # possible end-to-end proof that the deployed bundle can boot.
  serverless-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Read from .python-version so this job and Vercel can never drift.
          python-version-file: ".python-version"

      # Installs ONLY the serverless list. Deliberately does not install the
      # root requirements.txt - having both would defeat the entire purpose.
      - name: Install ONLY the serverless dependency set
        run: pip install -r api/requirements.txt

      # Fails if any pin lacks a wheel for this Python, or if the bundle
      # reaches a module that isn't in the list.
      - name: Import the app the way Vercel does
        env:
          # Dummy values - config is validated at import, but nothing
          # connects. No network, no database, no real secret.
          DATABASE_URL: postgresql+asyncpg://user:pass@localhost/db
          JWT_SECRET: ci-import-check-not-a-real-secret
          CORS_ORIGINS: http://localhost
          ENVIRONMENT: production
          DB_SERVERLESS: "true"
          RUN_STARTUP_MIGRATIONS: "false"
          SINGLE_STORE_MODE: "true"
          ALLOWED_HOSTS: "*"
        run: |
          python - <<'PY'
          import sys

          try:
              import api.index
          except ModuleNotFoundError as exc:
              print(
                  f"::error::The serverless bundle cannot import: {exc}. "
                  f"api/index.py reaches a module whose package is NOT in "
                  f"api/requirements.txt. On Vercel this is not a warning - "
                  f"it is a cold-start crash, so EVERY request 500s. Either "
                  f"add the missing package to api/requirements.txt, or make "
                  f"the offending import lazy so the bundle stops reaching it."
              )
              sys.exit(1)

          routes = len(api.index.app.routes)
          if routes <= 0:
              print("::error::app imported but registered zero routes.")
              sys.exit(1)

          print(f"Serverless bundle OK: app imported, {routes} routes registered.")
          PY
