global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # Ghir Laffaire API — exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: "glstore_api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
    # Label every metric with the environment so you can filter in Grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "glstore-api"

  # Prometheus self-monitoring (optional but useful for dashboards)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
